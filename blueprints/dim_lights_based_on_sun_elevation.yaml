blueprint:
  name: Dim lights based on sun elevation
  description: Adjust brightness of lights based on the current sun elevation. If
    force debug is enabled, you need to execute this automation manually or let Home
    Assistant restart before the changes take effect.
  source_url: https://github.com/Tazmania0/homeassistant-blueprints/blob/master/blueprints/dim_lights_based_on_sun_elevation.yaml
  domain: automation
  input:
    target_lights:
      name: Lights
      description: The lights to control the brightness of
      selector:
        target:
          entity:
          - domain:
            - light
    state_trigger_lights:
      name: Trigger lights on state changes (optional)
      description: Optional list of light entities or a light group to monitor for
        recovery. Only reacts when a monitored entity transitions from unavailable/unknown
        to an available state (e.g. after a power cut or integration restart). General
        on/off or attribute changes do not trigger the automation through this input,
        so it is safe to use a group entity here without causing excessive runs.
      default: []
      selector:
        entity:
          domain:
          - light
          multiple: true
          reorder: false
    max_brightness:
      name: Maximum brightness percent
      description: Brightness to set as the maximum brightness
      default: 100
      selector:
        number:
          min: 2.0
          max: 100.0
          unit_of_measurement: '%'
          mode: slider
          step: 1.0
    min_brightness:
      name: Minimum brightness percent
      description: Brightness to set as the minimum brightness
      default: 1
      selector:
        number:
          min: 1.0
          max: 99.0
          unit_of_measurement: '%'
          mode: slider
          step: 1.0
    reverse:
      name: Reverse brightness
      description: Inverts the brightness curve only within the active transition
        window. Use this when you want lower sun elevation to produce brighter light
        (or vice versa), without changing when daytime/nighttime are considered active.
      default: false
      selector:
        boolean: {}
    daylight_mode:
      name: Daylight mode
      description: Keeps lights at maximum during the day plateau and minimum during
        the night plateau, with smooth transitions at sunrise and sunset. This is
        different from Reverse brightness - Daylight mode changes day/night behavior
        and anchor handling, while Reverse brightness only flips the slope inside
        a transition range.
      default: false
      selector:
        boolean: {}
    allowance:
      name: Change Allowance
      description: How much can the brightness be changed without this automation
        stop updating the brightness. If set to 0% this automation will stop updating
        the brightness if the brightness has been changed at all since the last triggering
        of this automation. If set to 100% this automation will keep on and update
        the brightness even if you have manually changed the brightness to any other
        value since the last trigger.
      default: 0
      selector:
        number:
          min: 0.0
          max: 100.0
          unit_of_measurement: '%'
          mode: slider
          step: 1.0
    turn_on:
      name: Turn on lights automatically
      description: Turn on lights when sun is setting.
      default: false
      selector:
        boolean: {}
    start_elevation_setting:
      name: Elevation of the sun to start dim the light when the sun is setting
      description: Sunset transition start point. When the sun drops below this elevation,
        the automation begins adjusting brightness toward the sunset endpoint.
      default: 0
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    end_elevation_setting:
      name: Elevation of the sun when the light shall be fully dimmed when the sun
        is setting (night minimum in Daylight mode)
      description: In Daylight mode, this is the night anchor. At or below this elevation
        the brightness reaches the configured minimum.
      default: -30
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    turn_off:
      name: Turn off lights automatically
      description: Turn off lights when sun has risen.
      default: false
      selector:
        boolean: {}
    start_elevation_rising:
      name: Elevation of the sun to start brighten the light when the sun is rising
      description: Sunrise transition start point. When the sun rises above this elevation,
        the automation begins adjusting brightness toward the sunrise endpoint.
      default: -8
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    end_elevation_rising:
      name: Elevation of the sun when the light shall have maximum brightness when
        the sun is rising (day maximum in Daylight mode)
      description: In Daylight mode, this is the day anchor. At or above this elevation
        the brightness reaches the configured maximum.
      default: 6
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    transition_time:
      name: Transition time in seconds between brightness values
      default: 0
      selector:
        number:
          min: 0.0
          max: 5.0
          unit_of_measurement: s
          mode: slider
          step: 0.25
    min_color_temp_kelvin:
      name: Minimum color temperature (Kelvin)
      description: Warmest color temperature used at the lowest normalized sun level.
      default: 2200
      selector:
        number:
          min: 1500.0
          max: 10000.0
          unit_of_measurement: K
          mode: slider
          step: 50.0
    max_color_temp_kelvin:
      name: Maximum color temperature (Kelvin)
      description: Coolest color temperature used at the highest normalized sun level.
      default: 6000
      selector:
        number:
          min: 1500.0
          max: 10000.0
          unit_of_measurement: K
          mode: slider
          step: 50.0
    weather_entity:
      name: Weather entity (optional)
      description: Optional weather source (for example weather.home). Compatible
        with Home Assistant weather entities including the default Met.no integration.
        Uses the current weather condition (state, or condition attribute fallback)
        such as sunny, partlycloudy, cloudy, or rainy to apply a small cooling multiplier.
      default: ''
      selector:
        entity:
          domain:
          - weather
          reorder: false
          multiple: false
    debugging:
      name: Debug logging
      description: 'WARNING: Don''t enable this unless you have activated ''logger''
        in your configuration.yaml file. Turn on debugging of this automation. In
        order for this to take effect you need to manually trigger (EXECUTE) this
        automation or let Home Assistant restart before debug will be turned on/off.'
      default: false
      selector:
        boolean: {}
variables:
  allowance_input: !input allowance
  allowance_value: '{{ allowance_input|float * 2.54 }}'
  micro_brightness_delta: '{{ [1, allowance_value|float * 0.5]|max }}'
  micro_color_temp_delta: 50
  debugging: !input debugging
  target_lights: !input target_lights
  entity_list: "{%- set target = target_lights | default({}, true) -%} {%- set entities
    = target.entity_id if target is mapping and 'entity_id' in target else target
    -%} {%- set raw_list = [entities] if entities is string else (entities if entities
    is sequence and entities is not mapping else []) -%} {%- set expanded = namespace(entities=[])
    -%} {%- for e in raw_list | reject('none') | reject('equalto', '') -%}\n
    \ {%- set children = state_attr(e, 'entity_id') -%}\n  {%- if children is sequence
    and children is not string -%}\n    {%- set expanded.entities = expanded.entities
    + children -%}\n  {%- else -%}\n    {%- set expanded.entities = expanded.entities
    + [e] -%}\n  {%- endif -%}\n{%- endfor -%} {{ expanded.entities | unique
    | list }}"
  transition_time: !input transition_time
  turn_on: !input turn_on
  turn_off: !input turn_off
  reverse: !input reverse
  daylight_mode: !input daylight_mode
  start_setting: !input start_elevation_setting
  start_rising: !input start_elevation_rising
  end_setting: !input end_elevation_setting
  end_rising: !input end_elevation_rising
  max_brightness_input: !input max_brightness
  max_brightness: '{{ max_brightness_input|float }}'
  min_brightness_input: !input min_brightness
  min_brightness: '{{ min_brightness_input|float }}'
  min_color_temp_kelvin_input: !input min_color_temp_kelvin
  min_color_temp_kelvin: '{{ min_color_temp_kelvin_input|float }}'
  max_color_temp_kelvin_input: !input max_color_temp_kelvin
  max_color_temp_kelvin: '{{ max_color_temp_kelvin_input|float }}'
  weather_entity: !input weather_entity
  weather_condition: "{% if weather_entity is string and weather_entity|length > 0
    %}\n  {% set ws = states(weather_entity) %}\n  {% if ws in ['unknown', 'unavailable',
    'none', ''] %}\n    {{ state_attr(weather_entity, 'condition') or 'none' }}\n
    \ {% else %}\n    {{ ws }}\n  {% endif %}\n{% else %}\n  none\n{% endif %}"
  weather_cooling_multiplier: "{# Source: condition of the configured weather entity
    (weather_entity input). #} {% set ws = weather_condition|lower %} {% if ws in
    ['cloudy', 'fog', 'rainy', 'pouring', 'snowy', 'snowy-rainy', 'hail', 'lightning-rainy']
    %}\n  1.08\n{% elif ws in ['partlycloudy', 'windy', 'windy-variant'] %}\n  1.04\n{%
    else %}\n  1.0\n{% endif %}"
  weather_fallback_active: '{{ weather_entity is not string or weather_entity|length
    == 0 }}'
  elevation: '{{ state_attr(''sun.sun'', ''elevation'')|float(0) }}'
  elevation_bucket: '{{ (elevation|float / 2) | round(0) }}'
  rising: '{{ state_attr(''sun.sun'', ''rising'') if state_attr(''sun.sun'', ''rising'')
    is not none else (elevation|float >= 0) }}'
  transition_span: "{% if daylight_mode %}\n  {{ (end_rising|float - end_setting|float)|abs
    }}\n{% elif rising %}\n  {{ (end_rising|float - start_rising|float)|abs
    }}\n{% else %}\n  {{ (start_setting|float - end_setting|float)|abs }}\n{% endif
    %}"
  normalized_position: "{% if transition_span|float == 0 %}\n  1\n{% elif rising %}\n
    \ {% if daylight_mode %}\n    {{ ((elevation|float - end_setting|float) / transition_span|float)
    | float }}\n  {% else %}\n    {{ ((elevation|float - start_rising|float) / transition_span|float) | float
    }}\n  {% endif %}\n{% elif daylight_mode %}\n  {{ ((elevation|float - end_setting|float)
    / transition_span|float) | float
    }}\n{% else %}\n  {{ ((elevation|float - end_setting|float) / transition_span|float)
    | float }}\n{% endif %}"
  clamped_position: '{{ [0, [normalized_position|float, 1]|min]|max }}'
  effective_position: '{{ 1 - clamped_position|float if reverse else clamped_position|float
    }}'
  brightness_percent: '{{ (min_brightness|float + ((max_brightness|float - min_brightness|float)
    * effective_position|float)) | round(0) }}'
  brightness: '{{ (brightness_percent|float * 2.55) | round(0) | int }}'
  last_brightness: '{{ brightness }}'
  color_temp_kelvin_base: '{{ (min_color_temp_kelvin|float + ((max_color_temp_kelvin|float
    - min_color_temp_kelvin|float) * effective_position|float)) | round(0) }}'
  color_temp_kelvin: '{{ ((color_temp_kelvin_base|float * weather_cooling_multiplier|float
    / 50) | round(0) | int * 50) }}'
  current_states: "{%- set data = namespace(items=[]) -%} {%- for e in entity_list
    -%}\n  {%- set data.items = data.items + [e ~ ': ' ~ states(e)] -%}\n{%- endfor
    -%} {{ data.items | join(', ') }}"
  error_msg: ''
  trigger_is_event: '{{ trigger is defined and trigger.platform == ''event'' }}'
  skip_event: "{{ trigger_is_event\n   and trigger.event.event_type == 'call_service'\n
    \  and trigger.event.data.service_data is defined\n   and trigger.event.data.service_data|length
    > 1 }}"
  affected_entities: "{%- if skip_event -%}\n  {{ [] }}\n{%- elif trigger is not defined
    -%}\n  {{ entity_list }}\n{%- elif trigger.platform == 'state'\n      and trigger.entity_id
    == 'sun.sun' -%}\n  {{ entity_list }}\n{%- elif trigger.platform == 'state'\n      and trigger.entity_id
    is defined\n      and trigger.from_state is defined\n      and trigger.to_state
    is defined -%}\n  {%- set old_s = trigger.from_state.state if trigger.from_state
    is not none else none -%}\n  {%- set new_s = trigger.to_state.state if trigger.to_state
    is not none else none -%}\n  {%- if old_s in ['unavailable', 'unknown'] and new_s
    not in ['unavailable', 'unknown', none] -%}\n    {%- if trigger.entity_id in entity_list
    -%}\n      {{ [trigger.entity_id] }}\n    {%- else -%}\n      {{ entity_list }}\n
    \   {%- endif -%}\n  {%- else -%}\n    {{ [] }}\n  {%- endif -%}\n{%- elif trigger.platform
    != 'event' -%}\n  {{ entity_list }}\n{%- elif trigger.event.event_type
    == 'call_service'\n      and trigger.event.data.service_data is defined\n      and
    trigger.event.data.service_data.entity_id is defined -%}\n  {%- if trigger.event.data.service_data.entity_id
    is string -%}\n    {%- set eids = [trigger.event.data.service_data.entity_id]
    -%}\n  {%- else -%}\n    {%- set eids = trigger.event.data.service_data.entity_id
    -%}\n  {%- endif -%}\n  {%- set data = namespace(e=[]) -%}\n  {%- for e in eids
    -%}\n    {%- if e in entity_list -%}\n      {%- set data.e = data.e + [e] -%}\n
    \   {%- endif -%}\n  {%- endfor -%}\n  {{ data.e }}\n{%- else -%}\n  {{ [] }}\n{%-
    endif -%}"
  affected_available_entities: "{%- set data = namespace(entities=[]) -%} {%- for
    e in affected_entities -%}\n  {%- if states(e) not in ['unavailable', 'unknown']
    -%}\n    {%- set data.entities = data.entities + [e] -%}\n  {%- endif -%}\n{%-
    endfor -%} {{ data.entities }}"
  all_affected_unavailable: '{{ affected_entities|length > 0 and affected_available_entities|length
    == 0 }}'
  sun_elevation_trigger: "{{ trigger is defined\n   and (\n     (trigger.platform
    == 'state' and trigger.entity_id == 'sun.sun')\n     or trigger.platform ==
    'template'\n     or trigger.platform == 'time_pattern'\n   ) }}"
  force_turn_on: "{{ turn_on and trigger is defined and (\n   (trigger_is_event
    and trigger.event.event_type == 'call_service' and trigger.event.data.service
    == 'turn_on')\n   or (trigger.id is defined and trigger.id in ['sunset_turn_on_crossed',
    'reverse_turn_on_crossed'])\n) }}"
  force_turn_off: "{{ turn_off and trigger is defined and (\n   (trigger_is_event
    and trigger.event.event_type == 'call_service' and trigger.event.data.service
    == 'turn_off')\n   or (trigger.id is defined and trigger.id in ['sunrise_turn_off_crossed',
    'reverse_turn_off_crossed'])\n) }}"
  force_recovery_sync: "{{ trigger is defined\n   and trigger.platform == 'state'\n
    \  and trigger.entity_id != 'sun.sun'\n   and trigger.from_state is defined\n
    \  and trigger.to_state is defined\n   and trigger.from_state.state in ['unavailable',
    'unknown']\n   and trigger.to_state.state not in ['unavailable', 'unknown',
    none] }}"
  run_reason: "{% if trigger is not defined %}\n  manual_execute\n{% elif trigger.platform
    == 'homeassistant' %}\n  startup\n{% elif trigger_is_event and trigger.event.event_type
    == 'call_service' %}\n  manual_light_event\n{% elif force_recovery_sync %}\n
    \ recovery_sync\n{% elif sun_elevation_trigger %}\n  sun_update\n{% else %}\n
    \ other\n{% endif %}"
  turn_on_entities: "{%- if force_turn_on -%}\n  {%- set data = namespace(entities=[])
    -%}\n  {%- for e in affected_available_entities -%}\n    {%- set scm = state_attr(e,
    'supported_color_modes') or [] -%}\n    {%- set supports_color_temp = ('color_temp'
    in scm) or ('color_temp_kelvin' in scm) -%}\n    {%- set can_dim = (state_attr(e,
    'brightness') is not none) or ('brightness' in scm) or ('hs' in scm) or ('xy'
    in scm) or ('rgb' in scm) or supports_color_temp -%}\n    {%- if not can_dim
    -%}\n      {%- set data.entities = data.entities + [e] -%}\n    {%- endif -%}\n
    \ {%- endfor -%}\n  {{ data.entities }}\n{%- else -%}\n  {{ [] }}\n{%- endif
    -%}"
  dim_entities: "{%- set data = namespace(entities=[]) -%} {%- for e in entity_list
    -%}\n  {%- set current_brightness = state_attr(e, 'brightness') -%}\n  {%- set
    desired_brightness = brightness if brightness is defined else current_brightness
    -%}\n  {%- set current_color_temp_kelvin = state_attr(e, 'color_temp_kelvin')
    -%}\n  {%- set desired_color_temp_kelvin = color_temp_kelvin if color_temp_kelvin
    is defined else current_color_temp_kelvin -%}\n  {%- set is_on = states(e) ==
    'on' -%}\n  {%- set last_changed = (now() - states[e].last_changed) -%}\n  {%-
    set scm = state_attr(e, 'supported_color_modes') or [] -%}\n  {%- set supports_color_temp
    = ('color_temp' in scm) or ('color_temp_kelvin' in scm) -%}\n  {%- set can_dim
    = (\n        (state_attr(e, 'brightness') is not none)\n        or ('brightness'
    in scm) or ('hs' in scm) or ('xy' in scm)\n        or ('rgb' in scm) or supports_color_temp\n
    \     ) or (not is_on) -%}\n  {%- set brightness_delta = ((current_brightness
    - desired_brightness)|abs) if current_brightness is not none and desired_brightness
    is not none else micro_brightness_delta|float -%}\n  {%- set color_temp_delta
    = ((current_color_temp_kelvin - desired_color_temp_kelvin)|abs) if supports_color_temp
    and current_color_temp_kelvin is not none and desired_color_temp_kelvin is not
    none else 0 -%}\n  {# logic continues… #}\n  {%- if e in affected_available_entities
    -%}\n    {%- if run_reason == 'manual_light_event' and (not is_on or (is_on and last_changed.total_seconds()
    < 2)) -%}\n      {%- set data.entities = data.entities + [e] -%}\n    {%- elif
    run_reason == 'manual_execute' and can_dim and is_on -%}\n      {%- set data.entities
    = data.entities + [e] -%}\n    {%- elif
    run_reason == 'recovery_sync' and can_dim and is_on -%}\n      {%- set data.entities =
    data.entities + [e] -%}\n    {%- elif
    can_dim and force_turn_on -%}\n      {%- set data.entities = data.entities + [e]
    -%}\n    {%- elif can_dim and is_on and (\n            brightness_delta|float >= micro_brightness_delta|float\n
    \           or (supports_color_temp and color_temp_delta|float >= micro_color_temp_delta|float)\n
    \         ) and ((allowance_input|float == 100.0)\n               or ((current_brightness
    - (last_brightness|default(desired_brightness)))|abs <= allowance_value)) -%}\n
    \     {%- set data.entities = data.entities + [e] -%}\n    {%- endif -%}\n  {%-
    endif -%}\n{%- endfor -%} {{ data.entities }}"
  micro_delta_debug: "{%- set data = namespace(items=[]) -%} {%- for e in affected_available_entities
    -%}\n  {%- set current_brightness = state_attr(e, 'brightness') -%}\n  {%- set
    desired_brightness = brightness if brightness is defined else current_brightness
    -%}\n  {%- set current_color_temp_kelvin = state_attr(e, 'color_temp_kelvin')
    -%}\n  {%- set desired_color_temp_kelvin = color_temp_kelvin if color_temp_kelvin
    is defined else current_color_temp_kelvin -%}\n  {%- set scm = state_attr(e,
    'supported_color_modes') or [] -%}\n  {%- set supports_color_temp = ('color_temp'
    in scm) or ('color_temp_kelvin' in scm) -%}\n  {%- set brightness_delta =
    ((current_brightness - desired_brightness)|abs) if current_brightness is not
    none and desired_brightness is not none else 'n/a' -%}\n  {%- set color_temp_delta
    = ((current_color_temp_kelvin - desired_color_temp_kelvin)|abs) if supports_color_temp
    and current_color_temp_kelvin is not none and desired_color_temp_kelvin is not
    none else 'n/a' -%}\n  {%- set data.items = data.items + [e ~ ': brightness='
    ~ brightness_delta ~ ', color_temp=' ~ color_temp_delta] -%}\n{%- endfor -%}
    {{ data.items | join('; ') }}"
  dim_color_temp_entities: "{%- set data = namespace(entities=[]) -%} {%- for e in
    dim_entities -%}\n  {%- set scm = state_attr(e, 'supported_color_modes') or []
    -%}\n  {%- if ('color_temp' in scm) or ('color_temp_kelvin' in scm) -%}\n    {%-
    set data.entities = data.entities + [e] -%}\n  {%- endif -%}\n{%- endfor -%} {{
    data.entities }}"
  dim_brightness_only_entities: "{%- set data = namespace(entities=[]) -%} {%- for
    e in dim_entities -%}\n  {%- set scm = state_attr(e, 'supported_color_modes')
    or [] -%}\n  {%- if not (('color_temp' in scm) or ('color_temp_kelvin' in scm))
    -%}\n    {%- set data.entities = data.entities + [e] -%}\n  {%- endif -%}\n{%-
    endfor -%} {{ data.entities }}"
  turn_off_entities: "{%- if force_turn_off -%}\n  {{ affected_available_entities
    }}\n{%- else -%}\n  {{ [] }}\n{%- endif -%}"
trigger_variables:
  trigger_target_lights: !input target_lights
  trigger_turn_on: !input turn_on
  trigger_turn_off: !input turn_off
  trigger_reverse: !input reverse
  trigger_start_setting: !input start_elevation_setting
  trigger_end_setting: !input end_elevation_setting
  trigger_end_rising: !input end_elevation_rising
  trigger_entity_list: "{%- set target = trigger_target_lights | default({}, true)
    -%} {%- set entities = target.entity_id if target is mapping and 'entity_id' in
    target else target -%} {%- set raw_list = [entities] if entities is string else
    (entities if entities is sequence and entities is not mapping else []) -%} {{
    raw_list\n   | reject('none')\n   | reject('equalto', '')\n   | unique\n   | list
    }}"
trigger:
- platform: template
  id: sunset_turn_on_crossed
  value_template: "{% set elevation = state_attr('sun.sun', 'elevation')|float(0)
    %} {% set rising = state_attr('sun.sun', 'rising') if state_attr('sun.sun',
    'rising') is not none else false %} {{ trigger_turn_on and not trigger_reverse
    and not rising and elevation <= trigger_start_setting|float }}"
- platform: template
  id: reverse_turn_on_crossed
  value_template: "{% set elevation = state_attr('sun.sun', 'elevation')|float(0)
    %} {% set rising = state_attr('sun.sun', 'rising') if state_attr('sun.sun',
    'rising') is not none else false %} {{ trigger_turn_on and trigger_reverse
    and rising and elevation >= trigger_end_rising|float }}"
- platform: template
  id: sunrise_turn_off_crossed
  value_template: "{% set elevation = state_attr('sun.sun', 'elevation')|float(0)
    %} {% set rising = state_attr('sun.sun', 'rising') if state_attr('sun.sun',
    'rising') is not none else false %} {{ trigger_turn_off and not trigger_reverse
    and rising and elevation >= trigger_end_rising|float }}"
- platform: template
  id: reverse_turn_off_crossed
  value_template: "{% set elevation = state_attr('sun.sun', 'elevation')|float(0)
    %} {% set rising = state_attr('sun.sun', 'rising') if state_attr('sun.sun',
    'rising') is not none else false %} {{ trigger_turn_off and trigger_reverse
    and not rising and elevation <= trigger_end_setting|float }}"
- platform: template
  id: sun_dim_update
  value_template: "{% set elevation_tenths = (state_attr('sun.sun', 'elevation')|float(0)
    * 10) | round(0) | int %} {{ elevation_tenths % 20 == 0 }}"
- platform: time_pattern
  id: sun_update_interval
  minutes: /10
- platform: state
  id: recovery_state_available
  entity_id: !input state_trigger_lights
  from:
  - unavailable
  - unknown
- platform: event
  id: manual_light_turn_on
  event_type: call_service
  event_data:
    domain: light
    service: turn_on
  enabled: !input turn_on
- platform: event
  id: manual_light_turn_off
  event_type: call_service
  event_data:
    domain: light
    service: turn_off
  enabled: !input turn_off
- platform: homeassistant
  id: homeassistant_start
  event: start
mode: restart
action:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ debugging and trigger is not defined }}'
    sequence:
    - service: logger.set_level
      data:
        homeassistant.components.blueprint.dim_lights_based_on_sun_elevation: DEBUG
  - conditions:
    - condition: template
      value_template: '{{ debugging and trigger.platform == ''homeassistant'' and
        trigger.event == ''start'' }}'
    sequence:
    - service: logger.set_level
      data:
        homeassistant.components.blueprint.dim_lights_based_on_sun_elevation: DEBUG
  default:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ error_msg|length }}'
      sequence:
      - service: system_log.write
        data:
          level: error
          logger: homeassistant.components.blueprint.dim_lights_based_on_sun_elevation
          message: '{{ error_msg }}'
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ debugging }}'
        sequence:
        - service: system_log.write
          data:
            level: debug
            logger: homeassistant.components.blueprint.dim_lights_based_on_sun_elevation
            message: " DEBUG:\n skip_event: {{ skip_event }}\n allowance_value: {{
              allowance_value }}\n run_reason: {{ run_reason }}\n micro_brightness_delta: {{ micro_brightness_delta
              }}\n micro_color_temp_delta: {{ micro_color_temp_delta }}\n affected_entities:
              {{ affected_entities }}\n micro_delta_debug: {{ micro_delta_debug }}\n\n
              elevation: {{ elevation }}\n elevation_bucket:
              {{ elevation_bucket }} ({% if rising %}{{ start_rising ~ ', ' ~
              end_rising }}{% else %}{{ start_setting ~ ', ' ~ end_setting }}{% endif
              %})\n weather_condition: {{ weather_condition }}\n weather_fallback_active:
              {{ weather_fallback_active }}\n weather_cooling_multiplier: {{ weather_cooling_multiplier
              }}\n color_temp_kelvin: {{ color_temp_kelvin }}\n new brightness:
              {{ brightness }}\n baseline brightness: {{ last_brightness|default('n/a')
              }}\n current_states:
              {{ current_states }}\n \n force_turn_on: {{ force_turn_on }}\n force_turn_off:
              {{ force_turn_off }}\n \n entities: {{ entity_list }}\n \n turn_on_entities:
              {{ turn_on_entities }}\n \n dim_entities: {{ dim_entities }}\n dim_color_temp_entities:
              {{ dim_color_temp_entities }}\n dim_brightness_only_entities: {{ dim_brightness_only_entities
              }}\n \n turn_off_entities: {{ turn_off_entities }}\n \n {% if trigger
              is defined %}Triggered by: {{ trigger.platform }}\n{% endif %} {% if
              trigger is defined and trigger.platform == 'state' and trigger.from_state.entity_id
              == 'sun.sun' -%} from: (elevation: {{ trigger.from_state.attributes.elevation
              }}, azimuth: {{ trigger.from_state.attributes.azimuth }})\n to:   (elevation:
              {{ trigger.to_state.attributes.elevation }}, azimuth: {{ trigger.to_state.attributes.azimuth
              }})\n {% endif %} {% if trigger is defined and trigger.platform == 'event'
              -%} entity_id: {{ trigger.event.data.service_data.entity_id }}\n service_data_length:
              {{ trigger.event.data.service_data|length }}\n complete event data:
              {{ trigger.event.data }}\n {% endif %} "
      default: []
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and
            turn_off_entities|length > 0 }}'
        sequence:
        - service: light.turn_off
          data:
            entity_id: '{{ turn_off_entities }}'
            transition: '{{ transition_time }}'
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and
            turn_on_entities|length > 0 }}'
        sequence:
        - service: light.turn_on
          data:
            entity_id: '{{ turn_on_entities }}'
            transition: '{{ transition_time }}'
      default: []
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and
            dim_color_temp_entities|length > 0 }}'
        sequence:
        - service: light.turn_on
          data:
            entity_id: '{{ dim_color_temp_entities }}'
            brightness: '{{ brightness }}'
            color_temp_kelvin: '{{ color_temp_kelvin }}'
            transition: '{{ transition_time }}'
      default: []
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and
            dim_brightness_only_entities|length > 0 }}'
        sequence:
        - service: light.turn_on
          data:
            entity_id: '{{ dim_brightness_only_entities }}'
            brightness: '{{ brightness }}'
            transition: '{{ transition_time }}'
      default: []
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ force_recovery_sync and not all_affected_unavailable
            and dim_entities|length > 0 }}'
        sequence:
        - repeat:
            count: 3
            sequence:
            - delay:
                seconds: 10
            - variables:
                recovery_available_entities: "{%- set data = namespace(entities=[])
                  -%} {%- for e in entity_list -%}\n  {%- if states(e) not
                  in ['unavailable', 'unknown'] -%}\n    {%- set data.entities =
                  data.entities + [e] -%}\n  {%- endif -%}\n{%- endfor -%} {{ data.entities
                  }}"
                recovery_dim_entities: "{%- set data = namespace(entities=[]) -%}
                  {%- for e in recovery_available_entities -%}\n  {%- set is_on =
                  states(e) == 'on' -%}\n  {%- set scm = state_attr(e, 'supported_color_modes')
                  or [] -%}\n  {%- set supports_color_temp = ('color_temp' in scm)
                  or ('color_temp_kelvin' in scm) -%}\n  {%- set can_dim = (\n
                  \      (state_attr(e, 'brightness') is not none)\n        or ('brightness'
                  in scm) or ('hs' in scm) or ('xy' in scm)\n        or ('rgb' in
                  scm) or supports_color_temp\n      ) -%}\n  {%- if can_dim and
                  is_on -%}\n    {%- set data.entities = data.entities + [e] -%}\n
                  \ {%- endif -%}\n{%- endfor -%} {{ data.entities }}"
                recovery_color_temp_entities: "{%- set data = namespace(entities=[])
                  -%} {%- for e in recovery_dim_entities -%}\n  {%- set scm = state_attr(e,
                  'supported_color_modes') or [] -%}\n  {%- if ('color_temp' in
                  scm) or ('color_temp_kelvin' in scm) -%}\n    {%- set data.entities
                  = data.entities + [e] -%}\n  {%- endif -%}\n{%- endfor -%} {{ data.entities
                  }}"
                recovery_brightness_only_entities: "{%- set data = namespace(entities=[])
                  -%} {%- for e in recovery_dim_entities -%}\n  {%- set scm = state_attr(e,
                  'supported_color_modes') or [] -%}\n  {%- if not (('color_temp'
                  in scm) or ('color_temp_kelvin' in scm)) -%}\n    {%- set data.entities
                  = data.entities + [e] -%}\n  {%- endif -%}\n{%- endfor -%} {{ data.entities
                  }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ recovery_color_temp_entities|length > 0 }}'
                sequence:
                - service: light.turn_on
                  data:
                    entity_id: '{{ recovery_color_temp_entities }}'
                    brightness: '{{ brightness }}'
                    color_temp_kelvin: '{{ color_temp_kelvin }}'
                    transition: '{{ transition_time }}'
              default: []
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ recovery_brightness_only_entities|length > 0 }}'
                sequence:
                - service: light.turn_on
                  data:
                    entity_id: '{{ recovery_brightness_only_entities }}'
                    brightness: '{{ brightness }}'
                    transition: '{{ transition_time }}'
              default: []
      default: []
