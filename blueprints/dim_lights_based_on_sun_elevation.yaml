blueprint:
  name: Dim lights based on sun elevation
  description: Adjust brightness of lights based on the current sun elevation. If
    force debug is enabled, you need to execute this automation manually or let Home
    Assistant restart before the changes take effect.
  source_url: https://github.com/EvTheFuture/homeassistant-blueprints/blob/master/blueprints/dim_lights_based_on_sun_elevation.yaml
  domain: automation
  input:
    target_lights:
      name: Lights
      description: The lights to control the brightness of
      selector:
        target:
          entity:
          - domain:
            - light
    max_brightness:
      name: Maximum brightness percent
      description: Brightness to set as the maximum brightness
      default: 100
      selector:
        number:
          min: 2.0
          max: 100.0
          unit_of_measurement: '%'
          mode: slider
          step: 1.0
    min_brightness:
      name: Minimum brightness percent
      description: Brightness to set as the minimum brightness
      default: 1
      selector:
        number:
          min: 1.0
          max: 99.0
          unit_of_measurement: '%'
          mode: slider
          step: 1.0
    reverse:
      name: Reverse brightness
      description: Inverts the brightness curve only within the active transition
        window. Use this when you want lower sun elevation to produce brighter light
        (or vice versa), without changing when daytime/nighttime are considered active.
      default: false
      selector:
        boolean: {}
    daylight_mode:
      name: Daylight mode
      description: >-
        Keeps lights at maximum during the day plateau and minimum during the night
        plateau, with smooth transitions at sunrise and sunset. This is different
        from Reverse brightness - Daylight mode changes day/night behavior and anchor
        handling, while Reverse brightness only flips the slope inside a transition
        range.
      default: false
      selector:
        boolean: {}
    allowance:
      name: Change Allowance
      description: How much can the brightness be changed without this automation stop
        updating the brightness. If set to 0% this automation will stop updating the
        brightness if the brightness has been changed at all since the last triggering
        of this automation. If set to 100% this automation will keep on and update
        the brightness even if you have manually changed the brightness to any other
        value since the last trigger.
      default: 0
      selector:
        number:
          min: 0.0
          max: 100.0
          unit_of_measurement: '%'
          mode: slider
          step: 1.0
    turn_on:
      name: Turn on lights automatically
      description: Turn on lights when sun is setting.
      default: false
      selector:
        boolean: {}
    start_elevation_setting:
      name: Elevation of the sun to start dim the light when the sun is setting
      description: Sunset transition start point. When the sun drops below this
        elevation, the automation begins adjusting brightness toward the sunset endpoint.
      default: 0
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    end_elevation_setting:
      name: Elevation of the sun when the light shall be fully dimmed when the sun
        is setting (night minimum in Daylight mode)
      description: In Daylight mode, this is the night anchor. At or below this
        elevation the brightness reaches the configured minimum.
      default: -30
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    turn_off:
      name: Turn off lights automatically
      description: Turn off lights when sun has risen.
      default: false
      selector:
        boolean: {}
    start_elevation_rising:
      name: Elevation of the sun to start brighten the light when the sun is rising
      description: Sunrise transition start point. When the sun rises above this
        elevation, the automation begins adjusting brightness toward the sunrise endpoint.
      default: -8
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    end_elevation_rising:
      name: Elevation of the sun when the light shall have maximum brightness when the
        sun is rising (day maximum in Daylight mode)
      description: In Daylight mode, this is the day anchor. At or above this elevation
        the brightness reaches the configured maximum.
      default: 6
      selector:
        number:
          min: -60.0
          max: 60.0
          unit_of_measurement: °
          mode: slider
          step: 0.5
    transition_time:
      name: Transition time in seconds between brightness values
      default: 0
      selector:
        number:
          min: 0.0
          max: 5.0
          unit_of_measurement: s
          mode: slider
          step: 0.25
    min_color_temp_kelvin:
      name: Minimum color temperature (Kelvin)
      description: Warmest color temperature used at the lowest normalized sun level.
      default: 2200
      selector:
        number:
          min: 1500.0
          max: 10000.0
          unit_of_measurement: K
          mode: slider
          step: 50.0
    max_color_temp_kelvin:
      name: Maximum color temperature (Kelvin)
      description: Coolest color temperature used at the highest normalized sun level.
      default: 6000
      selector:
        number:
          min: 1500.0
          max: 10000.0
          unit_of_measurement: K
          mode: slider
          step: 50.0
    weather_entity:
      name: Weather entity (optional)
      description: Optional weather source (for example weather.home). Compatible with Home Assistant weather entities including the default Met.no integration. Uses the current weather condition (state, or condition attribute fallback) such as sunny, partlycloudy, cloudy, or rainy to apply a small cooling multiplier.
      default: ''
      selector:
        entity:
          domain: weather
    debugging:
      name: Debug logging
      description: 'WARNING: Don''t enable this unless you have activated ''logger''
        in your configuration.yaml file. Turn on debugging of this automation. In
        order for this to take effect you need to manually trigger (EXECUTE) this
        automation or let Home Assistant restart before debug will be turned on/off.'
      default: false
      selector:
        boolean: {}
variables:
  allowance_input: !input allowance
  allowance_value: '{{ allowance_input|float * 2.54 }}'
  debugging: !input debugging
  target_lights: !input target_lights
  entity_list: >-
    {%- set entities = target_lights.entity_id | default([], true) -%}
    {{ [entities] if entities is string else entities }}
  transition_time: !input transition_time
  turn_on: !input turn_on
  turn_off: !input turn_off
  reverse: !input reverse
  daylight_mode: !input daylight_mode
  start_setting: !input start_elevation_setting
  start_rising: !input start_elevation_rising
  end_setting: !input end_elevation_setting
  end_rising: !input end_elevation_rising
  max_brightness_input: !input max_brightness
  max_brightness: '{{ max_brightness_input|float }}'
  min_brightness_input: !input min_brightness
  min_brightness: '{{ min_brightness_input|float }}'
  # User-configured warm/cool bounds for the sun-based color temperature curve.
  min_color_temp_kelvin_input: !input min_color_temp_kelvin
  min_color_temp_kelvin: '{{ min_color_temp_kelvin_input|float }}'
  max_color_temp_kelvin_input: !input max_color_temp_kelvin
  max_color_temp_kelvin: '{{ max_color_temp_kelvin_input|float }}'
  # Optional weather entity used to nudge the sun curve cooler for cloudy/rainy conditions.
  weather_entity: !input weather_entity
  # Effective weather condition string used by this blueprint (state first, attribute fallback).
  weather_condition: >-
    {% if weather_entity is string and weather_entity|length > 0 %}
      {% set ws = states(weather_entity) %}
      {% if ws in ['unknown', 'unavailable', 'none', ''] %}
        {{ state_attr(weather_entity, 'condition') or 'none' }}
      {% else %}
        {{ ws }}
      {% endif %}
    {% else %}
      none
    {% endif %}
  # Multiplier applied to the sun-derived Kelvin value (1.0 means no weather adjustment).
  weather_cooling_multiplier: >-
    {# Source: condition of the configured weather entity (weather_entity input). #}
    {% set ws = weather_condition|lower %}
    {% if ws in ['cloudy', 'fog', 'rainy', 'pouring', 'snowy', 'snowy-rainy', 'hail', 'lightning-rainy'] %}
      1.08
    {% elif ws in ['partlycloudy', 'windy', 'windy-variant'] %}
      1.04
    {% else %}
      1.0
    {% endif %}
  # True when no weather entity is configured, meaning sun-only color temperature behavior.
  weather_fallback_active: '{{ weather_entity is not string or weather_entity|length == 0 }}'
  trigger_is_event: '{{ trigger is defined and trigger.platform == ''event'' }}'
  skip_event: '{{ trigger_is_event and trigger.event.data.service_data|length > 1
    }}'
  affected_entities: "{%- if skip_event -%}\n  {{ [] }}\n{%- elif trigger is not defined
    or trigger.platform != 'event' or trigger.event.data.service_data is not defined
    or trigger.event.data.service_data.entity_id is not defined -%}\n  {{ entity_list
    }}\n{%- else -%}\n  {%- if trigger.event.data.service_data.entity_id is string
    -%}\n    {%- set eids = [trigger.event.data.service_data.entity_id] -%}\n  {%-
    else -%}\n    {%- set eids = trigger.event.data.service_data.entity_id -%}\n  {%-
    endif -%}\n  {%- set data = namespace(e=[]) -%}\n  {%- for e in eids -%}\n    {%-
    if e in entity_list -%}\n      {%- set data.e = data.e + [e] -%}\n    {%- endif
    -%}\n  {% endfor %}\n  {{ data.e }}\n{%- endif -%}"
  affected_available_entities: "{%- set data = namespace(e=[]) -%}\n{%- for e in affected_entities -%}\n  {%- if states(e) not in ['unavailable', 'unknown', 'offline', 'none'] -%}\n    {%- set data.e = data.e + [e] -%}\n  {%- endif -%}\n{%- endfor -%}\n{{ data.e }}"
  all_affected_unavailable: '{{ affected_entities|length > 0 and affected_available_entities|length == 0 }}'
  current_states: "{%- set data = namespace(e=[]) -%} {%- for e in entity_list -%}\n
    \ {%- set a = {'entity_id': e, 'state': states(e), 'brightness': state_attr(e,
    'brightness')} -%}\n  {%- set data.e = data.e + [a] -%}\n{%- endfor -%} {{ data.e
    }}"
  error_msg: "{%- if start_setting|float <= end_setting|float -%}\n  {{ 'Start elevation
    must be greater than end elevation when the sun is setting' }}\n{%- elif start_rising|float
    >= end_rising|float -%}\n  {{ 'End elevation must be greater than start elevation
    when the sun is rising' }}\n{%- elif entity_list|length == 0 -%}\n  {{ 'No valid
    entities specified or found' }}\n{%- endif -%}"
  has_last: "{% if trigger is defined and trigger.platform == 'state' and trigger.from_state.entity_id
    == 'sun.sun' -%}\n  {{ True }}\n{% else %}\n  {{ False }}\n{% endif %}"
  rising: '{{ state_attr(''sun.sun'', ''rising'') }}'
  last_rising: '{% if has_last %}{{ trigger.from_state.attributes.rising }}{% else
    %}{{ rising }}{% endif %}'
  elevation: '{{ state_attr(''sun.sun'', ''elevation'') }}'
  last_elevation: '{% if has_last %}{{ trigger.from_state.attributes.elevation }}{%
    else %}{{ elevation }}{% endif %}'
  force_turn_on: '{{ turn_on and ((not reverse and not rising and last_elevation != "" and last_elevation >= end_setting|float and elevation <= start_setting|float) or (reverse and rising and last_elevation != "" and last_elevation <= start_rising|float and elevation >= end_rising|float)) }}'
  force_turn_off: '{{ turn_off and ((not reverse and rising and last_elevation != "" and last_elevation <= end_rising|float and elevation >= end_rising|float) or (reverse and not rising and last_elevation != "" and last_elevation >= end_setting|float and elevation <= end_setting|float)) }}'
  max_elevation: '{% if rising %}{{end_rising|float}}{% else %}{{start_setting|float}}{%
    endif %}'
  min_elevation: '{% if rising %}{{start_rising|float}}{% else %}{{end_setting|float}}{%
    endif %}'
  last_max_elevation: '{% if last_rising %}{{end_rising|float}}{% else %}{{start_setting|float}}{%
    endif %}'
  last_min_elevation: '{% if last_rising %}{{start_rising|float}}{% else %}{{end_setting|float}}{%
    endif %}'
  elevation_range: '{{ max_elevation - min_elevation }}'
  last_elevation_range: '{{ last_max_elevation - last_min_elevation }}'
  brightness_range: '{{ max_brightness - min_brightness }}'
  delta_to_min: '{{ elevation - min_elevation }}'
  last_delta_to_min: '{{ last_elevation|float - last_min_elevation }}'
  full_percent_raw: >-
    {% if daylight_mode %}
      {%- set daylight_range = (end_rising|float - end_setting|float) -%}
      {%- set daylight_delta = (elevation|float - end_setting|float) -%}
      {% if daylight_range <= 0 %}
        0
      {% elif daylight_delta / daylight_range < 0 %}
        0
      {% elif daylight_delta / daylight_range > 1 %}
        1
      {% else %}
        {{ daylight_delta / daylight_range }}
      {% endif %}
    {% else %}
      {% if delta_to_min / elevation_range < 0 %}0{% elif delta_to_min / elevation_range > 1 %}1{% else %}{{delta_to_min / elevation_range}}{% endif %}
    {% endif %}
  full_percent: '{% if reverse %}{{1 - full_percent_raw}}{% else %}{{full_percent_raw}}{%
    endif %}'
  last_full_percent_raw: >-
    {% if daylight_mode %}
      {%- set daylight_range = (end_rising|float - end_setting|float) -%}
      {%- set last_daylight_delta = (last_elevation|float - end_setting|float) -%}
      {% if daylight_range <= 0 %}
        0
      {% elif last_daylight_delta / daylight_range < 0 %}
        0
      {% elif last_daylight_delta / daylight_range > 1 %}
        1
      {% else %}
        {{ last_daylight_delta / daylight_range }}
      {% endif %}
    {% else %}
      {% if last_delta_to_min / elevation_range < 0 %}0{% elif last_delta_to_min / elevation_range > 1 %}1{% else %}{{last_delta_to_min / elevation_range}}{% endif %}
    {% endif %}
  last_full_percent: '{% if reverse %}{{1 - last_full_percent_raw}}{% else %}{{last_full_percent_raw}}{%
    endif %}'
  brightness_pct: '{{ full_percent * brightness_range + min_brightness }}'
  last_brightness_pct: '{{ last_full_percent * brightness_range + min_brightness }}'
  brightness: '{{ (brightness_pct * 2.54)|int }}'
  last_brightness: '{{ (last_brightness_pct * 2.54)|int }}'
  # Sun-position-derived target color temperature before weather adjustment.
  raw_color_temp_kelvin: '{{ full_percent * (max_color_temp_kelvin - min_color_temp_kelvin) + min_color_temp_kelvin }}'
  # Weather-adjusted (unclamped) target color temperature.
  adjusted_color_temp_kelvin_unclamped: '{{ raw_color_temp_kelvin * weather_cooling_multiplier }}'
  # Weather-adjusted target clamped to configured min/max Kelvin.
  adjusted_color_temp_kelvin: '{% if adjusted_color_temp_kelvin_unclamped|float > max_color_temp_kelvin|float %}{{ max_color_temp_kelvin|float }}{% elif adjusted_color_temp_kelvin_unclamped|float < min_color_temp_kelvin|float %}{{ min_color_temp_kelvin|float }}{% else %}{{ adjusted_color_temp_kelvin_unclamped|float }}{% endif %}'
  # Final integer Kelvin value sent to compatible lights.
  color_temp_kelvin: '{{ adjusted_color_temp_kelvin|int }}'
  turn_on_entities: >-
    {%- if force_turn_on -%}
      {%- set data = namespace(entities=[]) -%}
      {%- for e in affected_available_entities -%}
        {%- set scm = state_attr(e, 'supported_color_modes') or [] -%}
        {%- set has_bri = (state_attr(e, 'brightness') is not none)
                           or ('brightness' in scm) or ('hs' in scm)
                           or ('xy' in scm) or ('rgb' in scm) or ('color_temp' in scm) -%}
        {# If it doesn't support brightness, just turn it on #}
        {%- if not has_bri -%}
          {%- set data.entities = data.entities + [e] -%}
        {%- endif -%}
      {%- endfor -%}
    {{ data.entities }}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  dim_entities: >-
    {%- set data = namespace(entities=[]) -%}
    {%- for e in entity_list -%}
      {%- set current_brightness = state_attr(e, 'brightness') -%}
      {%- set is_on = states(e) == 'on' -%}
      {%- set last_changed = (now() - states[e].last_changed) -%}
      {%- set scm = state_attr(e, 'supported_color_modes') or [] -%}
      {%- set can_dim = (
            (state_attr(e, 'brightness') is not none)
            or ('brightness' in scm) or ('hs' in scm) or ('xy' in scm)
            or ('rgb' in scm) or ('color_temp' in scm)
          ) or (not is_on) -%}
      {# logic continues… #}
      {%- if e in affected_available_entities -%}
        {%- if trigger_is_event and (not is_on or (is_on and last_changed.total_seconds() < 2)) -%}
          {%- set data.entities = data.entities + [e] -%}
        {%- elif can_dim and force_turn_on -%}
          {%- set data.entities = data.entities + [e] -%}
        {%- elif can_dim and is_on and current_brightness != brightness
              and ((allowance_input|float == 100.0)
                   or ((current_brightness - last_brightness)|abs <= allowance_value)) -%}
          {%- set data.entities = data.entities + [e] -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ data.entities }}
  # Subset of dimmable entities that support color temperature updates.
  dim_color_temp_entities: >-
    {%- set data = namespace(entities=[]) -%}
    {%- for e in dim_entities -%}
      {%- set scm = state_attr(e, 'supported_color_modes') or [] -%}
      {%- if ('color_temp' in scm) or ('color_temp_kelvin' in scm) -%}
        {%- set data.entities = data.entities + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ data.entities }}
  # Subset of dimmable entities that do not support color temperature updates.
  dim_brightness_only_entities: >-
    {%- set data = namespace(entities=[]) -%}
    {%- for e in dim_entities -%}
      {%- set scm = state_attr(e, 'supported_color_modes') or [] -%}
      {%- if not (('color_temp' in scm) or ('color_temp_kelvin' in scm)) -%}
        {%- set data.entities = data.entities + [e] -%}
      {%- endif -%}
    {%- endfor -%}
    {{ data.entities }}
  turn_off_entities: "{%- if force_turn_off -%}\n  {{ affected_available_entities }}\n{%- else -%}\n
    \ {{ [] }}\n{%- endif -%}"
trigger_variables:
  trigger_target_lights: !input target_lights
trigger:
- platform: state
  entity_id: sun.sun
  attribute: elevation
- platform: event
  event_type: call_service
  event_data:
    domain: light
    service: turn_on
- platform: homeassistant
  event: start
- platform: state
  entity_id: >-
    {%- set target = trigger_target_lights | default({}, true) -%}
    {%- set entities = target.entity_id if target is mapping else target -%}
    {%- set entities = entities | default([], true) -%}
    {{ [entities] if entities is string else entities }}
  from: 'off'
  to: 'on'
- platform: state
  entity_id: >-
    {%- set target = trigger_target_lights | default({}, true) -%}
    {%- set entities = target.entity_id if target is mapping else target -%}
    {%- set entities = entities | default([], true) -%}
    {{ [entities] if entities is string else entities }}
  from: 'unavailable'
mode: queued
action:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ debugging and trigger is not defined }}'
    sequence:
    - service: logger.set_level
      data:
        homeassistant.components.blueprint.dim_lights_based_on_sun_elevation: DEBUG
  - conditions:
    - condition: template
      value_template: '{{ debugging and trigger.platform == ''homeassistant'' and
        trigger.event == ''start'' }}'
    sequence:
    - service: logger.set_level
      data:
        homeassistant.components.blueprint.dim_lights_based_on_sun_elevation: DEBUG
  default:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ error_msg|length }}'
      sequence:
      - service: system_log.write
        data:
          level: error
          logger: homeassistant.components.blueprint.dim_lights_based_on_sun_elevation
          message: '{{ error_msg }}'
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ debugging }}'
        sequence:
        - service: system_log.write
          data:
            level: debug
            logger: homeassistant.components.blueprint.dim_lights_based_on_sun_elevation
            message: " DEBUG:\n skip_event: {{ skip_event }}\n allowance_value: {{
              allowance_value }}\n affected_entities: {{ affected_entities }}\n\n
              elevation: {{ elevation }} ({% if rising %}{{ start_rising ~ ', ' ~
              end_rising }}{% else %}{{ start_setting ~ ', ' ~ end_setting }}{% endif
              %})\n weather_condition: {{ weather_condition }}\n weather_fallback_active: {{ weather_fallback_active }}\n weather_cooling_multiplier: {{ weather_cooling_multiplier }}\n color_temp_kelvin: {{ color_temp_kelvin }}\n {% if last_elevation != \"\" -%}last elevation: {{ last_elevation
              }}\n{% endif %} new brightness: {{ brightness }}\n {% if last_elevation
              != \"\" -%}last brightness: {{ last_brightness }}\n{% endif %} \n current_states:
              {{ current_states }}\n \n force_turn_on: {{ force_turn_on }}\n force_turn_off:
              {{ force_turn_off }}\n \n entities: {{ entity_list }}\n \n turn_on_entities:
              {{ turn_on_entities }}\n \n dim_entities: {{ dim_entities }}\n dim_color_temp_entities: {{ dim_color_temp_entities }}\n dim_brightness_only_entities: {{ dim_brightness_only_entities }}\n \n turn_off_entities:
              {{ turn_off_entities }}\n \n {% if trigger is defined %}Triggered by:
              {{ trigger.platform }}\n{% endif %} {% if trigger is defined and trigger.platform
              == 'state' and trigger.from_state.entity_id == 'sun.sun' -%} from: (elevation:
              {{ trigger.from_state.attributes.elevation }}, azimuth: {{ trigger.from_state.attributes.azimuth
              }})\n to:   (elevation: {{ trigger.to_state.attributes.elevation }},
              azimuth: {{ trigger.to_state.attributes.azimuth }})\n {% endif %} {%
              if trigger is defined and trigger.platform == 'event' -%} entity_id:
              {{ trigger.event.data.service_data.entity_id }}\n service_data_length:
              {{ trigger.event.data.service_data|length }}\n complete event data:
              {{ trigger.event.data }}\n {% endif %} "
      default: []
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and turn_off_entities|length > 0 }}'
        sequence:
        - service: light.turn_off
          data:
            entity_id: '{{ turn_off_entities }}'
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and turn_on_entities|length > 0 }}'
        sequence:
        - service: light.turn_on
          data:
            entity_id: '{{ turn_on_entities }}'
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and dim_color_temp_entities|length > 0 }}'
        sequence:
        - service: light.turn_on
          data:
            entity_id: '{{ dim_color_temp_entities }}'
            brightness: '{{ brightness }}'
            color_temp_kelvin: '{{ color_temp_kelvin }}'
            transition: '{{ transition_time }}'
      - conditions:
        - condition: template
          value_template: '{{ not skip_event and not all_affected_unavailable and dim_brightness_only_entities|length > 0 }}'
        sequence:
        - service: light.turn_on
          data:
            entity_id: '{{ dim_brightness_only_entities }}'
            brightness: '{{ brightness }}'
            transition: '{{ transition_time }}'
      default: []
